[package]
name = "parole-gliclass"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
parole-core = { path = "../src-core" }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "3"
