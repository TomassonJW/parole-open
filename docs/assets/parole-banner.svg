  <text x="78" y="264" fill="#365359" font-family="Arial, Helvetica, sans-serif" font-size="25">Your words, on your machine.</text>
  <text x="78" y="301" fill="#617975" font-family="Arial, Helvetica, sans-serif" font-size="19">La voix, en local.</text>
