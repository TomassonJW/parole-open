<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Parole - local-first transcription</title>
  <desc id="desc">Parole. Your words, on your machine. La voix, en local. Experimental open-source transcription.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f3e9"/><stop offset="1" stop-color="#e9ece8"/></linearGradient>
    <linearGradient id="signal"><stop stop-color="#15958d"/><stop offset="1" stop-color="#70b9a4"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172e34" stroke-opacity=".045"/></pattern>
  </defs>
